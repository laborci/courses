site_name: courses
site_description: Egyetemi tananyagok heti bontásban
site_url: https://laborci.github.io/courses/
repo_url: https://github.com/laborci/courses
use_directory_urls: true
theme:
  name: material
  language: hu
  font: false
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
  palette:
    scheme: slate
    primary: custom
    accent: custom
extra_css:
  - stylesheets/extra.css
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
